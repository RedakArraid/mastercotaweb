<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mastercota — UI/UX redesign</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body style="background:#FFFFFF;">

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="components/landing.jsx"></script>
<script type="text/babel" src="components/donation.jsx"></script>
<script type="text/babel" src="components/mobile-auth.jsx"></script>
<script type="text/babel" src="components/mobile-home.jsx"></script>
<script type="text/babel" src="components/mobile-detail.jsx"></script>
<script type="text/babel" src="components/mobile-account.jsx"></script>
<script type="text/babel" src="components/admin.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

function App() {
  return (
    <DesignCanvas title="MasterCota — Proposition de refonte UI/UX" initialZoom={0.45}>

      <DCSection id="intro" title="01 · Direction" subtitle="« Navy + or » — la palette du logo MasterCota, sur fond blanc. Un seul accent doré, blocs navy profonds, typographie douce.">
        <DCArtboard id="moodboard" label="Système visuel" width={1440} height={900}>
          <Moodboard />
        </DCArtboard>
      </DCSection>

      <DCSection id="web" title="02 · Web" subtitle="Landing page + page de don publique (les deux surfaces les plus visibles).">
        <DCArtboard id="landing" label="Landing page · /" width={1440} height={3200}>
          <Landing />
        </DCArtboard>
        <DCArtboard id="donation" label="Page de cagnotte · /c/[slug]" width={1440} height={2400}>
          <Donation />
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-auth" title="03 · Mobile — Onboarding & connexion" subtitle="Splash → Onboarding → Saisie numéro → Vérification OTP.">
        <DCArtboard id="m-splash" label="Splash" width={420} height={880}>
          <MobileSplash />
        </DCArtboard>
        <DCArtboard id="m-onboarding" label="Onboarding · slide 2/3" width={420} height={880}>
          <MobileOnboarding />
        </DCArtboard>
        <DCArtboard id="m-phone" label="Saisie du numéro" width={420} height={880}>
          <MobilePhone />
        </DCArtboard>
        <DCArtboard id="m-otp" label="Vérification OTP" width={420} height={880}>
          <MobileOTP />
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-core" title="04 · Mobile — Cœur produit" subtitle="Accueil, création de cagnotte, détail temps réel.">
        <DCArtboard id="m-home" label="Accueil" width={420} height={880}>
          <MobileHome />
        </DCArtboard>
        <DCArtboard id="m-create" label="Créer une cagnotte" width={420} height={880}>
          <MobileCreate />
        </DCArtboard>
        <DCArtboard id="m-detail" label="Détail de cagnotte" width={420} height={880}>
          <MobileDetail />
        </DCArtboard>
      </DCSection>

      <DCSection id="mobile-account" title="05 · Mobile — Compte" subtitle="Profil + configuration du compte de versement (Mobile Money / bancaire).">
        <DCArtboard id="m-profile" label="Profil" width={420} height={880}>
          <MobileProfile />
        </DCArtboard>
        <DCArtboard id="m-payout" label="Compte de versement" width={420} height={880}>
          <MobilePayout />
        </DCArtboard>
      </DCSection>

      <DCSection id="admin" title="06 · Admin — Web" subtitle="Sidebar navy, tableau de bord, listes filtrables. Mêmes tokens que tout le reste du système.">
        <DCArtboard id="a-login" label="Login admin" width={1440} height={900}>
          <AdminLogin />
        </DCArtboard>
        <DCArtboard id="a-dashboard" label="Tableau de bord" width={1440} height={1100}>
          <AdminDashboard />
        </DCArtboard>
        <DCArtboard id="a-cotisations" label="Cotisations" width={1440} height={1000}>
          <AdminCotisations />
        </DCArtboard>
        <DCArtboard id="a-users" label="Utilisateurs" width={1440} height={1000}>
          <AdminUsers />
        </DCArtboard>
      </DCSection>

    </DesignCanvas>
  );
}

function Moodboard() {
  return (
    <div style={{
      background: "var(--cream)", color: "var(--ink)",
      width: "100%", height: "100%", padding: "56px 64px",
      display: "grid", gridTemplateColumns: "1.1fr 1fr", gap: 64, alignItems: "start"
    }}>
      <div>
        <span className="eyebrow">MasterCota · Système de design</span>
        <img
          src="assets/logo-full.png"
          alt="MasterCota"
          style={{ height: 70, width: "auto", display: "block", margin: "24px 0 28px" }}
        />
        <h1 className="serif" style={{
          fontSize: 64, lineHeight: 0.98, letterSpacing: "-0.03em", margin: "0 0 28px"
        }}>
          Navy + or,<br />
          <span className="serif-italic" style={{ color: "var(--accent)" }}>plus simple de cotiser.</span>
        </h1>
        <p style={{ fontSize: 16, color: "var(--ink-2)", lineHeight: 1.55, maxWidth: 500, margin: 0 }}>
          La marque MasterCota repose sur deux couleurs : un bleu navy de confiance et un or vif.
          Sur fond blanc, l'or accentue ; le navy structure. Une seule famille typographique, des chiffres en mono.
        </p>

        <div style={{ marginTop: 48, display: "grid", gap: 24 }}>
          {/* Type sample */}
          <div style={{ borderTop: "1px solid var(--ink)", paddingTop: 18 }}>
            <span className="eyebrow">Typographie</span>
            <div style={{ marginTop: 14 }}>
              <div className="serif" style={{ fontSize: 42, letterSpacing: "-0.025em", lineHeight: 1.05 }}>
                Geist <span className="serif-italic" style={{ color: "var(--accent)" }}>— interface & display</span>
              </div>
              <div style={{ fontSize: 16, marginTop: 8, color: "var(--ink-2)", lineHeight: 1.5, maxWidth: 480 }}>
                Une seule famille sans-serif, calme et lisible. Tailles et graisses font tout le travail
                de hiérarchie. L'italique est emprunté à Newsreader pour une emphase discrète.
              </div>
              <div className="num" style={{ fontSize: 18, marginTop: 10 }}>
                1 425 000 F &nbsp; — Geist Mono pour les chiffres
              </div>
            </div>
          </div>

          {/* Color row */}
          <div style={{ borderTop: "1px solid var(--ink)", paddingTop: 18 }}>
            <span className="eyebrow">Palette</span>
            <div style={{ display: "flex", gap: 12, marginTop: 14 }}>
              {[
                ["#FFFFFF", "Blanc", "Fond principal"],
                ["#FAFBFD", "Papier", "Cartes / surfaces"],
                ["#143268", "Navy", "Texte / blocs profonds"],
                ["#F4B829", "Or", "Accent unique"],
                ["#2D6A4F", "Forêt", "Succès"],
              ].map(([hex, name, role]) => (
                <div key={hex} style={{ flex: 1 }}>
                  <div style={{
                    height: 80, background: hex, borderRadius: 12,
                    border: "1px solid " + (hex === "#FFFFFF" || hex === "#FAFBFD" ? "var(--line)" : "transparent")
                  }} />
                  <div style={{ marginTop: 8, fontSize: 12, fontWeight: 500 }}>{name}</div>
                  <div className="mono" style={{ fontSize: 10, color: "var(--ink-3)" }}>{hex}</div>
                  <div style={{ fontSize: 10, color: "var(--ink-3)", marginTop: 2 }}>{role}</div>
                </div>
              ))}
            </div>
          </div>
        </div>
      </div>

      {/* Right column — components preview */}
      <div style={{ display: "grid", gap: 20 }}>
        {/* Card sample */}
        <div className="card" style={{ padding: 24 }}>
          <span className="eyebrow">Carte cagnotte · variant accent</span>
          <h3 className="serif" style={{ fontSize: 24, margin: "10px 0 4px", letterSpacing: "-0.01em" }}>
            Tontine Bureau Plateau
          </h3>
          <div style={{ fontSize: 13, color: "var(--ink-3)" }}>Mensuelle · Mai 2026</div>
          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 18 }}>
            <div className="num" style={{ fontSize: 32, letterSpacing: "-0.02em" }}>
              84 000 <span style={{ fontSize: 14, color: "var(--ink-3)" }}>F</span>
            </div>
            <div className="num" style={{ fontSize: 13, color: "var(--ink-3)" }}>/ 150 000 F</div>
          </div>
          <div className="bar" style={{ marginTop: 12 }}>
            <div className="bar-fill" style={{ width: "56%" }} />
          </div>
          <div style={{ display: "flex", justifyContent: "space-between", marginTop: 8, fontSize: 11, color: "var(--ink-3)" }}>
            <span><span className="num" style={{ color: "var(--ink)" }}>56 %</span> · 6 contributeurs</span>
            <span className="mono">J−11</span>
          </div>
        </div>

        {/* Buttons */}
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <button className="btn btn-accent">Contribuer 5 000 F</button>
          <button className="btn btn-primary">Télécharger l'app</button>
          <button className="btn btn-ghost">Voir la démo</button>
        </div>

        {/* Number sample */}
        <div className="card" style={{ padding: 24, background: "var(--ink)", color: "var(--paper)", border: "none" }}>
          <div className="eyebrow" style={{ color: "rgba(255,255,255,0.55)" }}>Total collecté</div>
          <div className="num" style={{ fontSize: 56, letterSpacing: "-0.03em", lineHeight: 1, marginTop: 8 }}>
            1 425 000 <span style={{ fontSize: 16, color: "rgba(255,255,255,0.55)" }}>F</span>
          </div>
          <div style={{ display: "flex", gap: 8, marginTop: 16 }}>
            <span className="pill" style={{ background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.18)", color: "var(--paper)" }}>
              <span className="dot" /> 3 cagnottes actives
            </span>
            <span className="pill" style={{ background: "rgba(255,255,255,0.08)", border: "1px solid rgba(255,255,255,0.18)", color: "var(--paper)" }}>
              47 contributeurs
            </span>
          </div>
        </div>

        {/* Principles */}
        <div style={{ display: "grid", gap: 14 }}>
          {[
            ["Une seule police, plus douce", "Geist — sans-serif moderne, calme. Pas de serif éditorial agressif. L'italique reste une signature, en Newsreader."],
            ["Un seul accent : or", "Soulignements, CTA principal, italique d'œil. Jamais en aplat décoratif. Le navy structure, l'or accentue."],
            ["Chiffres en monospace", "Lisibilité financière, alignement vertical des montants, sentiment de rigueur."],
            ["Pas de gradients arbitraires", "Les anciens dégradés (royal blue, purple indigo, violet rose…) disparaissent au profit d'un système cohérent."],
          ].map(([t, d], i) => (
            <div key={i} style={{ borderTop: "1px solid var(--line)", paddingTop: 12 }}>
              <div style={{ display: "flex", gap: 12, alignItems: "baseline" }}>
                <span className="num" style={{ fontSize: 12, color: "var(--accent)" }}>0{i+1}</span>
                <div>
                  <div style={{ fontSize: 14, fontWeight: 500 }}>{t}</div>
                  <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 2, lineHeight: 1.45 }}>{d}</div>
                </div>
              </div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
